7}@keyframes pfIn{to{transform:translate(-50%,-50%) scale(1)}}.plate-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.plate-list li{display:flex;align-items:center;gap:8px;font-size:14px}.plate-list li .food{font-size:18px}.plate-list li b{font-size:13px;color:var(--muted)}.plate-list li.tot{border-top:1px dashed var(--line);padding-top:6px;font-weight:700}.plate-list li.tot b{color:var(--accent)}:root[data-theme=dark] .plate{background:radial-gradient(circle at 35% 30%,#3A4A42,#26332C 70%,#1C2620)}:root[data-theme=dark] .plate-in{background:radial-gradient(circle at 40% 35%,#33433B,#2A3831)}:root[data-theme=dark] .plate .pk{color:#BBF7D0}.qcard{align-items:center;position:relative}.qcard .qi{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:var(--surface);display:grid;place-items:center}.qcard .qi .i{margin:0}.qcard .lbl{font-family:var(--f-body);margin-bottom:2px}.qcard .qshare .i{color:var(--on-accent);margin:0}.qcard .qshare{width:42px;height:42px;flex:0 0 42px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}@media (prefers-reduced-motion:reduce){.plate .pf{animation:none;transform:translate(-50%,-50%)}}#story .st-goal{display:inline-flex;align-items:center;gap:4px;font-weight:700}#story .st-goal .i{width:15px;height:15px}#story .st-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:110px;align-items:end}#story .st-week div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}#story .st-bar{width:100%;max-width:28px;border-radius:8px;background:rgba(255,255,255,.3);height:0;transition:height .8s var(--d) cubic-bezier(.2,.8,.2,1)}#story .st-bar.ok{background:linear-gradient(180deg,#86EFAC,#22C55E)}#story.on .st-bar{height:var(--h)}#story .st-week small{color:rgba(255,255,255,.7)}#story .st-share .btn{background:#fff;color:#0F5132;font-size:16px;padding:15px}#story .st-a{op /* diet */
.datebar{display:flex;align-items:center;gap:8px}
.datebar h2{flex:1;text-align:center}
.meal-h{display:flex;align-items:center;gap:12px}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.items li{display:flex;align-items:center;gap:10px;font-size:14px}
.items li .k{margin-left:auto;font-family:var(--f-num);color:var(--muted);white-space:nowrap}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;border:0;background:var(--sunk);border-radius:11px;padding:9px 13px}
.check.on{background:var(--accent-soft);color:var(--accent)}
.tips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tips ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.tips li{display:flex;gap:6px}
.tips li .i{width:15px;height:15px;margin-top:2px}
.tipcol{border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.tipcol.yes{background:var(--accent-soft)} .tipcol.yes h3,.tipcol.yes .i{color:var(--accent)}
.tipcol.no{background:var(--bad-soft)} .tipcol.no h3,.tipcol.no .i{color:var(--bad)}
.note{background:var(--warn-soft);border-radius:13px;padding:11px 13px;font-size:13.5px;display:flex;gap:9px}
.note .i{color:var(--warn);margin-top:1px}
.week{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding-block:12px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.wrow:first-child{border-top:0}
.wd{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:var(--sunk);height:52px;font-size:11px;font-weight:700;color:var(--muted)}
.wd b{font-family:var(--f-num);font-size:18px;color:var(--fg);font-weight:500}
.wrow.today .wd{background:var(--accent);color:var(--on-accent)} .wrow.today .wd b{color:var(--on-accent)}
.wmeals{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-width:0}
.wmeals span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{aspect-ratio:1/1.15;max-width:100%;border:0;border-radius:11px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;min-width:0}
.cell b{font-family:var(--f-num);font-size:14px;font-weight:500}
.cell small{font-family:var(--f-num);font-size:9.5px;color:var(--muted)}
.cell .dt{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.cell .dt.r{background:transparent;border:1.5px solid var(--muted)}
.cell.today{background:var(--accent);color:var(--on-accent)} .cell.today small{color:var(--on-accent)} .cell.today .dt{background:var(--on-accent)}
.cell.past{opacity:.55}
.cell.blank{background:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* workout */
.ex{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding-block:11px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.ex:first-child{border-top:0}
.ex.sel .tile{background:var(--accent);color:var(--on-accent)}
.ex.done .tile{background:var(--accent-soft)}
.ex .cue{font-size:12.5px;color:var(--muted)}
.lvl{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700}

/* grocery */
.gi{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.gi:first-of-type{border-top:0}
.gi .need{font-size:12.5px;color:var(--muted)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:28px;height:28px;border-radius:8px;border:0;background:var(--sunk);display:grid;place-items:center;padding:0}
.step button .i{width:15px;height:15px}
.step span{font-family:var(--f-num);font-size:12.5px;min-width:52px;text-align:center}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles3>div{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tiles3 b{font-family:var(--f-num);font-size:22px;font-weight:500}

/* reminders + forms */
.rem{display:grid;grid-template-columns:32px 1fr auto auto;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.rem:first-child{border-top:0}
.sw{width:44px;height:26px;border-radius:99px;border:0;background:var(--line);position:relative;padding:0;flex:0 0 44px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw.on{background:var(--accent)} .sw.on::after{left:21px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:700;min-width:0}
.form .full{grid-column:1/-1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:7px 11px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.chips button .i{width:16px;height:16px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0;display:grid;place-items:center;color:#fff}
.swatch.on{box-shadow:0 0 0 2px var(--fg)}
.spark{width:100%;height:96px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
nav.tabs button .i{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on .i{transform:translateY(-1px)}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));width:min(430px,calc(100% - 24px));z-index:40;background:var(--fg);color:var(--bg);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.toast .tile{background:var(--accent);color:var(--on-accent)}
.toast p{font-size:13px;opacity:.85;margin-top:2px}
.toast .x{border:0;background:none;color:var(--bg);opacity:.7;padding:2px}

/* full-screen layers */
.layer{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.layer .in{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px 20px}
.wtop{display:flex;align-items:center;gap:12px}
.wtop .bar{flex:1}
.wbody{flex:1;display:flex;flex-direction:column;gap:18px}
.wbody h1{font-size:30px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;min-width:0}
.opt.col{flex-direction:column;align-items:flex-start}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .d{font-size:13px;color:var(--muted)}
.opt svg.sil{width:56px;height:76px}
.big{font-family:var(--f-num);font-size:56px;line-height:1;text-align:center}
.big small{font-size:18px;color:var(--muted)}
input[type=range]{width:100%;padding:0;background:none;border:0;accent-color:var(--accent);height:32px}
.stepper{display:flex;align-items:center;justify-content:center;gap:20px}
.stepper button{width:52px;height:52px;border-radius:16px;border:0;background:var(--surface);display:grid;place-items:center}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feat div{background:var(--surface);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;font-size:13.5px;font-weight:600}
.preview{border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;width:100%;border:1px solid rgba(128,128,128,.25)}
.preview i{display:block;height:7px;border-radius:4px}
.wfoot{position:sticky;bottom:0;padding-top:12px;padding-bottom:max(18px,env(safe-area-inset-bottom,0px));margin-top:8px;background:linear-gradient(transparent,var(--bg) 30%)}

/* player */
.player .in{gap:12px}
.pstage{position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(110% 80% at 50% 100%,var(--accent-soft),var(--surface) 72%);height:min(46vh,380px)}
.phase{position:absolute;top:12px;left:12px;display:flex;gap:6px}
.ptimer{font-family:var(--f-num);font-size:64px;line-height:1;text-align:center;letter-spacing:.02em}
.pctl{display:flex;align-items:center;justify-content:center;gap:18px}
.pctl .main{width:72px;height:72px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.pctl .main .i{width:30px;height:30px}
.pctl .sec{width:52px;height:52px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center}
.segbar{display:flex;gap:3px}
.segbar i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.segbar i.d{background:var(--accent)}
.segbar i.c{background:var(--warn)}
/* progress + motivation */
.quote{display:flex;gap:10px;align-items:flex-start;font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.3;padding:14px 16px;border-radius:var(--r);background:var(--accent-soft);text-wrap:balance}
.quote .i{color:var(--accent);margin-top:2px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--sunk);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;min-width:0;font-size:13px}
.badge.lock{opacity:.5}
.badge .small{font-size:11px;line-height:1.3}
.items li.warn{padding-left:42px;margin-top:-4px}
.items li.warn .pill{white-space:normal}
.risk{display:grid;grid-template-columns:32px 1fr;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.risk:first-of-type{border-top:0}
.chal{width:100%;justify-content:flex-start;text-align:left}
 .wkstrip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(78px,1fr);gap:7px;overflow-x:auto;padding-bottom:4px;margin-inline:-4px;padding-inline:4px}
.wkday{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;min-width:0}
.wkday .mini{width:100%;height:64px;display:grid;place-items:center}
.wkday .mini svg{width:100%;height:64px}
.wkday.today{border-color:var(--warn)}
.wkday.sel{border-color:var(--accent);background:var(--accent-soft)}
.wkday .pill{font-size:10.5px;padding:2px 7px}
.musc{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center}
@media (max-width:380px){.musc{grid-template-columns:1fr}}
/* swiper + motion */
.swiper{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:22px}
.swiper::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;width:100%;min-width:0;max-width:100%;box-sizing:border-box;scroll-snap-align:start;border-radius:22px;padding:18px;color:#fff;position:relative;overflow:hidden;min-height:240px;display:flex;flex-direction:column;gap:12px;isolation:isolate}
.slide .lbl{color:rgba(255,255,255,.88)}
.slide::before,.slide::after{content:"";position:absolute;border-radius:50%;z-index:-1}
.slide::before{width:190px;height:190px;right:-55px;top:-70px;background:rgba(255,255,255,.14)}
.slide::after{width:130px;height:130px;left:-45px;bottom:-55px;background:rgba(255,255,255,.08)}
.sl-cal{background:linear-gradient(140deg,#065F46,#16A34A 60%,#22C55E)}
.sl-steps{background:linear-gradient(140deg,#C2410C,#EA580C 55%,#F59E0B)}
.sl-pts{background:linear-gradient(140deg,#9D174D,#DB2777 55%,#F97316)}
.sl-goal{background:linear-gradient(140deg,#1E3A8A,#2563EB 55%,#06B6D4)}
.sl-week{background:linear-gradient(160deg,#111827,#1F2937)}
.sl-h{display:flex;justify-content:space-between;align-items:center}
.sl-ic{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.slide .ring .c{color:#fff}.slide .ring .c b{font-family:var(--f-num);font-size:22px;font-weight:500}
.sl-stats{display:flex;flex-direction:column;gap:8px;flex:1 1 0;min-width:0}
.slide>.row{min-width:0;width:100%}
.sl-stats div{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.2);padding-bottom:6px}
.sl-stats div:last-child{border:0}
.sl-stats b{font-family:var(--f-num);font-weight:500}

 if(p.goal==="muscle")target=tdee+250;
 const pg=pregOf(),preg=["t1","t2","t3"].includes(pg),cd=myConds();
 if(pg==="t1")target=Math.max(target,tdee);if(pg==="t2")target=tdee+340;if(pg==="t3")target=tdee+450;
 if(pg==="bf")target=tdee+400-(p.goal==="lose"?300:0);

 const bmi=p.weight/((p.height/100)**2);
 let prot=Math.round(p.weight*(p.goal==="lose"?1.8:p.goal==="muscle"?2:p.goal==="gain"?1.6:1.4));

const weekly=preg?0:p.goal==="lose"?(teen?0:(tdee-target)*7/7700):p.goal==="gain"?350*7/7700:p.goal==="muscle"?250*7/7700:0;
 const toGo=Math.abs(p.weight-p.targetW);
 const weeks=weekly>0&&toGo>0?Math.ceil(toGo/weekly):0;

function risks(){

 if(hasC("diabetes"))out.push(["b","Diabetes","Over years, high blood sugar can damage eyes, kidneys, nerves and the heart. Steady carbs, walks after meals and your medicine keep it in range."]);
 if(hasC("bp"))out.push(["b","High blood pressure","Untreated, it strains the heart and blood vessels and raises stroke risk. Less salt, more vegetables and regular walking help lower it."]);
 if(hasC("chol"))out.push(["w","High cholesterol","It slowly builds up in the arteries. Oats, beans, fish and less fried food help bring it down."]);
 if(hasC("pcos"))out.push(["w","PCOS","Insulin resistance can make weight harder to manage. Low-GI carbs, protein and strength training help hormones and cycles."]);
 if(hasC("thyroid"))out.push(["w","Underactive thyroid","Untreated, it causes tiredness and weight gain. Take your medicine as prescribed and keep regular check-ups."]);
 if(hasC("kidney"))out.push(["b","Kidney disease","Protein, salt and potassium need limits set by your doctor. This plan caps protein, but your renal diet comes first."]);
 if(hasC("heart"))out.push(["b","Heart condition","Only do exercise your doctor has cleared. We switched you to gentle training."]);
 if(hasC("joint"))out.push(["w","Joint or back pain","High-impact jumping can make it worse. We replaced jumps with low-impact moves."]);
 if(hasC("menopause"))out.push(["w","Menopause","Falling oestrogen speeds up bone loss and raises heart risk. Strength training, calcium and regular check-ups keep both in check."]);

function barChart(vals,labels,max,lines,unit){
 const W=330,H=140,pl=30,pb=20,pt=8,cw=(W-pl-4)/vals.length,bw=Math.max(4,cw*.62),Y=v=>pt+(1-v/max)*(H-pt-pb);
 let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${unit} chart">`;
 s+=`<text x="${pl-6}" y="${Y(max)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="DM Mono,monospace">${max}</text><text x="${pl-6}" y="${Y(0)+3}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="DM Mono,monospace">0</text>`;
 s+=`<line x1="${pl}" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)"/>`;
 (lines||[]).forEach(([v,l])=>{s+=`<line x1="${pl}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--warn)" stroke-dasharray="4 4"/><text x="${W-2}" y="${Y(v)-3}" text-anchor="end" font-size="9.5" fill="var(--warn)">${l}</text>`});
 vals.forEach((v,i)=>{const x=pl+i*cw+(cw-bw)/2;
  if(v==null)s+=`<rect x="${x}" y="${Y(0)-2}" width="${bw}" height="2" rx="1" fill="var(--line)"/>`;
  else{const y=Y(Math.min(v,max));s+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(2,Y(0)-y)}" rx="3" fill="${i===vals.length-1?"var(--accent)":"var(--accent-soft)"}" stroke="var(--accent)" stroke-width="${i===vals.length-1?0:1}"/>`}
  s+=`<text x="${x+bw/2}" y="${H-5}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${labels[i]}</text>`});
 return s+"</svg>";
}

const AU={ctx:null,timer:null,level:"power",bpm:128,step:0,next:0};
function audioInit(){
 if(AU.ctx){if(AU.ctx.state==="suspended")AU.ctx.resume();return}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 try{
 const c=AU.ctx=new AC();AU.master=c.createGain();AU.master.gain.value=.8;AU.master.connect(c.destination);
 AU.bus=c.createGain();AU.filt=c.createBiquadFilter();AU.filt.type="lowpass";AU.filt.frequency.value=16000;AU.bus.connect(AU.filt);AU.filt.connect(AU.master);
 const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=nb;
 }catch(e){AU.ctx=null}
}
const levelOf=met=>met>=7?"crazy":met>=4.5?"power":"flow";
const LV={crazy:{n:"Crazy mode",bpm:150},power:{n:"Power mode",bpm:128},flow:{n:"Flow mode",bpm:100}};
function musicStart(level){
 if(!AU.ctx||!S.sound.music)return;AU.level=level;AU.bpm=LV[level].bpm;
 if(!AU.timer){AU.step=0;AU.next=AU.ctx.currentTime+.06;AU.timer=setInterval(sched,25)}
}
function musicStop(){clearInterval(AU.timer);AU.timer=null}
function musicRest(on){if(!AU.ctx)return;const t=AU.ctx.currentTime;AU.filt.frequency.setTargetAtTime(on?650:16000,t,.15);AU.bus.gain.setTargetAtTime(on?.55:1,t,.15)}
function sched(){const c=AU.ctx;while(AU.next<c.currentTime+.12){playStep(AU.step,AU.next);AU.next+=60/AU.bpm/4;AU.step=(AU.step+1)%64}}
function env(g,t,v,d){g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d)}
function kick(t,v){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);env(g,t,v,.28);o.connect(g);g.connect(AU.bus);o.start(t);o.stop(t+.3)}
function noise(t,hp,v,d){const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.noise;f.type="highpass";f.frequency.value=hp;env(g,t,v,d);s.connect(f);f.connect(g);g.connect(AU.bus);s.start(t,Math.random()*.5);s.stop(t+d+.02)}
function tone(t,fq,type,v,d,lp,dest){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=fq;env(g,t,v,d);

function playStep(s,t){
 const L=AU.level,st=s%16,bar=Math.floor(s/16)%4,root=[0,-4,3,-2][bar],minor=bar===0;
 if(st%4===0)kick(t,L==="flow"?.55:1);
 if(L==="crazy"&&(st===10||st===14))kick(t,.6);
 if(L!=="flow"&&(st===4||st===12))noise(t,1500,.45,.16);
 if(L==="crazy"&&st%2===1)noise(t,7500,.2,.035);
 if(L!=="crazy"&&st%4===2)noise(t,7500,L==="flow"?.12:.22,.05);
 if(st%2===0){const off=[0,0,12,0,7,0,10,12][st/2];tone(t,55*Math.pow(2,(root+off)/12),"sawtooth",.2,60/AU.bpm/2*.9,L==="crazy"?1100:600)}

function spark(){
 const w=S.weights;if(w.length<2)return `<p class="small muted">Log your weight on two different days to see your trend.</p>`;
 const W=320,H=96,pad=26,ys=w.map(x=>x[1]),mn=Math.min(...ys)-.5,mx=Math.max(...ys)+.5,x0=w[0][0],x1=w[w.length-1][0];
 const X=v=>pad+(v-x0)/((x1-x0)||1)*(W-pad*2),Y=v=>10+(mx-v)/(mx-mn)*(H-30);
 const pts=w.map(([d,v])=>`${X(d).toFixed(1)},${Y(v).toFixed(1)}`).join(" "),last=w[w.length-1];
 return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Weight trend">
 <line x1="${pad}" x2="${W-pad}" y1="${Y((mn+mx)/2)}" y2="${Y((mn+mx)/2)}" stroke="var(--line)" stroke-dasharray="3 4"/>
 <polygon points="${X(x0)},${H-20} ${pts} ${X(x1)},${H-20}" fill="var(--accent-soft)"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
 <circle cx="${X(last[0])}" cy="${Y(last[1])}" r="4.5" fill="var(--accent)"/>
 <text x="${pad}" y="${H-4}" font-size="11" fill="var(--muted)" font-family="DM Mono,monospace">${fmtW(w[0][1])}</text>
 <text x="${W-pad}" y="${H-4}" font-size="11" fill="var(--fg)" text-anchor="end" font-family="DM Mono,monospace">${fmtW(last[1])}</text></svg>`;
}

let PL=null;
function buildSegs(from){
 const pl=todayPlan(),segs=[];
 pl.list.forEach(([id,m],i)=>{if(i<from)return;const e=EX[id];
  if(e.cont)segs.push({i,id,ph:"work",dur:m*60,round:1,rounds:1});
  else if(e.sets)for(let r=1;r<=m;r++){segs.push({i,id,ph:"work",dur:45,round:r,rounds:m});segs.push({i,id,ph:"rest",dur:75,round:r,rounds:m})}
  else for(let r=1;r<=m;r++){segs.push({i,id,ph:"work",dur:40,round:r,rounds:m});segs.push({i,id,ph:"rest",dur:20,round:r,rounds:m})}
 });
 segs.forEach((s,k)=>s.last=!segs[k+1]||segs[k+1].i!==s.i);
 return segs;
}
function openPlayer(from){
 audioInit();$("#toast").hidden=true;
 PL={segs:buildSegs(from),k:0,run:true,last:performance.now(),kcal:0,lastSec:-1};
 PL.left=PL.segs[0].dur;$("#player").hidden=false;document.body.style.overflow="hidden";
 enterSeg();PL.iv=setInterval(tickPlayer,200);
 try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>PL&&(PL.lock=l)).catch(()=>{})}catch(e){}
}
function enterSeg(){
 const s=PL.segs[PL.k],e=EX[s.id],nx=PL.segs.slice(PL.k+1).find(x=>x.ph==="work");
 renderPlayer();
 if(s.ph==="work"){musicStart(levelOf(e.met));musicRest(false);beep(1320,.22,.4);
  if(e.sets)speak(s.round===1?`${e.n}. ${e.reps}. Go!`:`Set ${s.round}. ${e.reps}. Go!`);else if(s.round===1)speak(`${e.n}. ${e.cue}. Go!`);else speak("Go!")}
 else{musicRest(true);speak(nx?(nx.i!==s.i?`Rest. Next up, ${EX[nx.id].n}.`:"Rest. Breathe."):"Last rest.")}
 if(!PL.run)musicStop();
}
function tickPlayer(){
 if(!PL||!PL.run){if(PL)PL.last=performance.now();return}
 const now=performance.now(),dt=(now-PL.last)/1000;PL.last=now;PL.left-=dt;
 const s=PL.segs[PL.k];if(s.ph==="work")PL.kcal+=EX[s.id].met*3.5*S.profile.weight/200/60*dt;
 const sec=Math.ceil(PL.left);
 if(sec!==PL.lastSec){PL.lastSec=sec;if(sec<=3&&sec>0)beep(880,.08,.3);
  const t=$("#ptime");if(t)t.textContent=fmtT(Math.max(0,sec));const k=$("#pkcal");if(k)k.textContent=Math.round(PL.kcal)}
 if(PL.left<=0)step(1);
}
function step(d){
 const s=PL.segs[PL.k];
 if(d>0&&s.last){S.done[s.i]=true;save()}
 PL.k+=d;
 if(PL.k<0)PL.k=0;
 if(PL.k>=PL.segs.length){finishPlayer();return}
 PL.left=PL.segs[PL.k].dur;PL.lastSec=-1;enterSeg();
}
function finishPlayer(){
 musicStop();clearInterval(PL.iv);beep(784,.15);setTimeout(()=>beep(988,.15),160);setTimeout(()=>beep(1319,.35),320);speak("Workout complete. Great job!");
 PL.finished=true;
 $("#player").innerHTML=`<div class="in" style="justify-content:center;text-align:center;align-items:center">
  <span class="tile" style="width:84px;height:84px;border-radius:26px">${ic("trophy")}</span>
  <h1>Workout complete!</h1><p class="muted">You burned about <b class="num">${Math.round(PL.kcal)}</b> kcal in this session.</p>
  <button class="btn block" data-pclose>${ic("check")}Done</button><button class="btn block ghost" data-shareprog>${ic("send")}Share my progress</button></div>`;
 try{maybeAskReview()}catch(e){}
}
function closePlayer(){
 if(!PL)return;musicStop();clearInterval(PL.iv);try{speechSynthesis.cancel()}catch(e){}try{PL.lock&&PL.lock.release()}catch(e){}
 PL=null;$("#player").hidden=true;document.body.style.overflow="";render();
}
const fmtT=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
function renderPlayer(){
 const s=PL.segs[PL.k],e=EX[s.id],pl=todayPlan(),rest=s.ph==="rest",nx=PL.segs.slice(PL.k+1).find(x=>x.ph==="work"),lv=levelOf(e.met);

  else if(kind==="now"){await cloudBackup(false)}

 v=Math.round(v*10)/10;const n=todayN();S.weights=S.weights.filter(x=>x[0]!==n);S.weights.push([n,v]);S.weights.sort((a,b)=>a[0]-b[0]);S.profile.weight=v;render();
 toast("scale","Weight saved",`${fmtW(v)} · calories updated for your new weight`,2800);return true}
const lastWeighN=()=>S.weights.length?S.weights[S.weights.length-1][0]:-99;
const weighInput=(id,lbl)=>`<div class="row" style="gap:8px;flex:1;justify-content:flex-end"><input id="${id}" type="number" step="0.1" inputmode="decimal" placeholder="${imp()?"lb":"kg"}" class="num" style="width:110px" aria-label="Your weight in ${imp()?"pounds":"kilograms"}"><button class="btn" data-logw="${id}">${ic("check")}${lbl||"Save"}</button></div>`;
function weightCard(){
 const p=S.profile,w=S.weights,start=w.length?w[0][1]:p.weight,now=w.length?w[w.length-1][1]:p.weight,diff=Math.round((now-start)*10)/10,toGo=Math.round((now-p.targetW)*10)/10,days=w.length?todayN()-lastWeighN():null;
 const good=p.goal==="gain"||p.goal==="muscle"?diff>0:diff<0;
 return `<div class="card wcard"><div class="row" style="gap:10px"><span class="tile">${ic("scale")}</span><div class="grow"><h2>Your weight</h2><div class="small muted">${days==null?"Not logged yet":days<=0?"Logged today":days===1?"Logged yesterday":`Last logged ${days} days ago${days>=7?" · time to weigh in":""}`}</div></div></div>
 <div class="wstats"><div><span class="lbl">Start</span><b>${fmtW(start)}</b></div><div><span class="lbl">Now</span><b>${fmtW(now)}</b><span class="small ${diff===0?"muted":good?"ok":"warn"}">${diff===0?"no change yet":(diff<0?"−":"+")+fmtW(Math.abs(diff))}</span></div><div><span class="lbl">Target</span><b>${fmtW(p.targetW)}</b><span class="small muted">${Math.abs(toGo)<.3?"reached!":fmtW(Math.abs(toGo))+" to go"}</span></div></div>
 ${spark()}
 <div class="row"><input id="wtIn" type="number" step="0.1" inputmode="decimal" placeholder="Today's weight (${imp()?"lb":"kg"})" class="grow num" aria-label="Today's weight"><button class="btn sm" data-logw="wtIn">${ic("plus")}Log</button></div>
 <p class="small muted">Weigh once a week, in the morning before breakfast. Each new weight updates your calories and workouts.</p></div>`;
}

ر کم بڑھتی ہے اور قدم بھی بڑھتے ہیں۔","Add a glass of milk or a spoon of nut butter to two meals for about 300 extra kcal.":"دو کھانوں میں ایک گلاس دودھ یا ایک چمچ نٹ بٹر شامل کریں، تقریباً 300 اضافی کیلوریز۔","Progressive overload: add a rep or 2.5 kg once you finish all sets with good form.":"بتدریج اضافہ: جب سب سیٹ صحیح طریقے سے ہو جائیں تو ایک ریپ یا 2.5 کلو بڑھائیں۔","Get 20–40 g of protein at each meal. Muscles grow best from steady supply.":"ہر کھانے میں 20 سے 40 گرام پروٹین لیں۔ مسلسل فراہمی سے پٹھے بہتر بڑھتے ہیں۔","Rest 2–3 minutes between heavy sets and 60–90 seconds on lighter ones.":"بھاری سیٹس کے بیچ 2 سے 3 منٹ اور ہلکے سیٹس کے بیچ 60 سے 90 سیکنڈ آرام کریں۔","Log your weights. If the numbers don't go up over a month, change something.":"اپنے وزن لکھیں۔ اگر ایک مہینے میں نمبر نہ بڑھیں تو کچھ بدلیں۔","Warm up with 2 light sets before your first heavy exercise.":"پہلی بھاری ورزش سے پہلے 2 ہلکے سیٹ سے وارم اپ کریں۔","No weights? Lower slowly for 3 seconds. It makes bodyweight moves much harder.":"وزن نہیں ہیں؟ 3 سیکنڈ میں آہستہ نیچے آئیں۔ اس سے جسمانی وزن کی ورزش بہت مشکل ہو جاتی ہے۔","Train at the same time every day. Habits stick to cues.":"روز ایک ہی وقت ورزش کریں۔ عادتیں اشاروں سے جڑتی ہیں۔","Stand up from a chair without your hands 10 times a day. It builds leg strength for life.":"دن میں 10 بار بغیر ہاتھوں کے کرسی سے کھڑے ہوں۔ اس سے عمر بھر ٹانگیں مضبوط رہتی ہیں۔","Practise balance while brushing your teeth: one foot, then the other.":"دانت صاف کرتے ہوئے توازن کی مشق کریں: ایک پاؤں، پھر دوسرا۔","At your pre-dawn meal, add protein and slow carbs so you stay full longer.":"سحری میں پروٹین اور دیر سے ہضم ہونے والے کاربز شامل کریں تاکہ دیر تک پیٹ بھرا رہے۔","Break your fast with water and something light, then pause before the main meal.":"روزہ پانی اور ہلکی چیز سے کھولیں، پھر بڑے کھانے سے پہلے تھوڑا رکیں۔","Break your fast with protein. It keeps the next hours of hunger calm.":"روزہ پروٹین سے کھولیں۔ اگلے گھنٹوں میں بھوک قابو میں رہتی ہے۔","Black coffee, plain tea and water are fine during your fasting window.":"روزے کے دوران بلیک کافی، سادہ چائے اور پانی ٹھیک ہیں۔","Taste before you salt. Most salt comes from bread, sauces and pickles.":"نمک ڈالنے سے پہلے چکھیں۔ زیادہ تر نمک روٹی، ساسز اور اچار سے آتا ہے۔","Start the day with oats. Their soluble fibre helps lower LDL cholesterol.":"دن کا آغاز اوٹس سے کریں۔ ان کا فائبر خراب کولیسٹرول کم کرتا ہے۔","Strength training 2–3 times a week improves how your body handles insulin.":"ہفتے میں 2 سے 3 بار طاقت کی ورزش جسم میں انسولین کا کام بہتر کرتی ہے۔","Eat small, frequent meals if you feel sick, and keep plain crackers by the bed.":"طبیعت خراب ہو تو تھوڑا تھوڑا اور بار بار کھائیں، اور بستر کے پاس سادہ بسکٹ رکھیں۔","Strong thighs protect your knees. Chair squats and slow step-ups are your friends.":"مضبوط رانیں گھٹنوں کی حفاظت کرتی ہیں۔ کرسی اسکواٹس اور آہستہ اسٹیپ اپس مددگار ہیں۔","Lift something heavy-ish twice a week. It is the best tool against bone loss.":"ہفتے میں دو بار کچھ وزنی اٹھائیں۔ ہڈیوں کی کمزوری کے خلاف یہ بہترین طریقہ ہے۔","Breakfast before school helps focus in class and energy for sport.":"اسکول سے پہلے ناشتہ کلاس میں توجہ اور کھیل کے لیے توانائی دیتا ہے۔","Protein at every meal helps keep muscle as you age: eggs, daal, fish or yogurt.":"ہر کھانے میں پروٹین عمر کے ساتھ پٹھے بچاتا ہے: انڈے، دال، مچھلی یا دہی۔","No sugary drinks today":"آج کوئی میٹھا مشروب نہیں","Eat 2 different vegetables today":"آج 2 مختلف سبزیاں کھائیں","Stand up and move every hour":"ہر گھنٹے اٹھیں اور چلیں پھریں","Take the stairs at least once":"کم از کم ایک بار سیڑھیاں استعمال کریں","Finish dinner 2 hours before bed":"سونے سے 2 گھنٹے پہلے رات کا کھانا ختم کریں","Cook one meal at home":"ایک کھانا گھر پر پکائیں","Eat fruit instead of a sweet":"مٹھائی کی جگہ پھل کھائیں","Be in bed before 11 pm":"رات 11 بجے سے پہلے بستر پر ہوں","Do 20 squats while the kettle boils":"کیتلی ابلنے تک 20 اسکواٹس کریں","Hold a 60-second plank":"60 سیکنڈ پلانک کریں","Reach 8,000 steps":"8,000 قدم پورے کریں","Balance on one foot for 30 seconds each side":"ہر طرف 30 سیکنڈ ایک پاؤں پر توازن","Do 10 chair stands":"10 بار کرسی سے اٹھیں","Drink 8 glasses of water outside fasting hours":"روزے کے اوقات کے علاوہ 8 گلاس پانی پئیں","Stay inside your eating window today":"آج کھانے کے وقت کے اندر رہیں","Log every set and weight you lift today":"آج ہر سیٹ اور وزن درج کریں","Hit your protein target today":"آج اپنا پروٹین ہدف پورا کریں","goal":"ہدف","Motion sensor blocked":"موشن سینسر بند ہے","Your phone didn't allow step counting here. Use the walk timer or copy steps from your health app.":"آپ کے فون نے یہاں قدم گننے کی اجازت نہیں دی۔ واک ٹائمر استعمال کریں یا ہیلتھ ایپ سے قدم لکھیں۔","No motion data here":"یہاں حرکت کا ڈیٹا نہیں","This view doesn't share your phone's motion sensor. The installed app will count steps on its own. For now, use the walk timer.":"یہ ویو فون کا موشن سینسر شیئر نہیں کرتا۔ انسٹال ایپ خود قدم گنے گی۔ فی الحال واک ٹائمر استعمال کریں۔","Drink a glass of water":"ایک گلاس پانی پئیں","# of # glasses so far today.":"آج اب تک # میں سے # گلاس۔","Workout time":"ورزش کا وقت","{x}, # minutes at home. Music is ready.":"{x}، گھر پر # منٹ۔ موسیقی تیار ہے۔","Photo updated":"تصویر بدل گئی","Couldn't use that photo":"یہ تصویر استعمال نہیں ہو سکی","Try a JPG or PNG picture.":"JPG یا PNG تصویر آزمائیں۔","Couldn't read that photo":"یہ تصویر پڑھی نہیں جا سکی","Your data is saved to your account.":"آپ کا ڈیٹا اکاؤنٹ میں محفوظ ہو گیا۔","Backup didn't work":"بیک اپ نہیں ہو سکا","Backup file saved":"بیک اپ فائل محفوظ ہو گئی","Couldn't save the file":"فائل محفوظ نہیں ہو سکی","Please try again.":"دوبارہ کوشش کریں۔","Check the number":"نمبر چیک کریں","Type your weight in {x}":"اپنا وزن {x} میں لکھیں","calories updated for your new weight":"نئے وزن کے مطابق کیلوریز اپ ڈیٹ","Couldn't open that photo":"یہ تصویر کھل نہیں سکی","Try another one.":"کوئی اور آزمائیں۔","Account deleted":"اکاؤنٹ حذف ہو گیا","Your account and online backup are gone. Your data on this phone is still here.":"آپ کا اکا ","Squat down, hands to the floor":"انزل للقرفصاء، اليدان على الأرض","Step or jump back into a plank":"ارجع بقدميك أو اقفز إلى بلانك","Bring your feet back to your hands":"أعد قدميك إلى يديك","Stand up and jump, arms overhead":"قف واقفز، والذراعان فوق الرأس","Stand tall, feet hip-width apart":"قف مستقيمًا، القدمان بعرض الوركين","Push hips back and bend your knees":"ادفع الوركين للخلف واثنِ الركبتين","Lower until thighs are level, chest up":"انزل حتى يستوي الفخذان، والصدر مرفوع","Drive up through your heels":"ادفع للأعلى بكعبيك","Stand tall, hands on hips":"قف مستقيمًا، اليدان على الخصر","Step forward, lower your back knee":"خطوة للأمام، أنزل ركبتك الخلفية","Push back up to standing":"ادفع وعد إلى الوقوف","Repeat with the other leg":"كرر بالساق الأخرى","High plank: body in one straight line":"بلانك عالٍ: الجسم في خط مستقيم","Lower your chest toward the floor":"أنزل صدرك نحو الأرض","Push the floor away to the top":"ادفع الأرض حتى الأعلى","Forearms under shoulders, body straight":"الساعدان تحت الكتفين، والجسم مستقيم","Squeeze glutes and abs, breathe slowly":"شدّ الأرداف والبطن، وتنفس ببطء","Lie on your back, knees bent, feet flat":"استلقِ على ظهرك، الركبتان مثنيتان، القدمان على الأرض","Push through your heels, lift your hips":"ادفع بكعبيك وارفع وركيك","Squeeze your glutes at the top":"شدّ أردافك في الأعلى","Lower slowly back down":"انزل ببطء","Hands on the chair edge behind you":"اليدان على حافة الكرسي خلفك","Bend your elbows to lower your body":"اثنِ مرفقيك لتنزل بجسمك","Press back up to straight arms":"ادفع حتى تستقيم ذراعاك","Hips high, body like an upside-down V":"الوركان عاليان، الجسم كحرف V مقلوب","Bend elbows, lower your head down":"اثنِ المرفقين وأنزل رأسك","Press back up":"ادفع للأعلى مجددًا","Stand tall, swing opposite arm and leg":"قف مستقيمًا، حرّك الذراع والساق المتعاكستين","Keep a steady, brisk pace":"حافظ على وتيرة ثابتة وسريعة","Stand tall and breathe in":"قف مستقيمًا وخذ نفسًا","Reach both arms up high":"ارفع ذراعيك عاليًا","Fold forward, reach toward your toes":"انحنِ للأمام نحو أصابع قدميك","Roll up slowly":"اصعد ببطء","Lie on the bench, weight over your chest":"استلقِ على البنش، والوزن فوق صدرك","Lower the weight to mid-chest":"أنزل الوزن إلى منتصف الصدر","Press it back up":"ادفعه للأعلى مجددًا","Weights at shoulder height, core tight":"الأوزان بمستوى الكتفين، والبطن مشدود","Press straight up overhead":"ادفع مباشرة فوق رأسك","Lower back to your shoulders":"أعدها إلى كتفيك","Hinge down, flat back, grip the bar":"انحنِ، الظهر مستقيم، أمسك البار","Push the floor away and stand up":"ادفع الأرض وقف","Hinge back down with control":"انحنِ للأسفل بتحكم","Hinge forward, arms hanging down":"انحنِ للأمام، والذراعان متدليتان","Pull your elbows back to your sides":"اسحب مرفقيك للخلف إلى جانبيك","Lower slowly":"أنزل ببطء","Arms up, hold the bar":"الذراعان للأعلى، أمسك البار","Let it rise with control":"اتركه يرتفع بتحكم","Arms straight, elbows at your sides":"الذراعان مستقيمتان، والمرفقان بجانبيك","Curl the weights up":"اثنِ الأوزان للأعلى","Soft knees, weight in front of thighs":"ركبتان مرنتان، والوزن أمام الفخذين","Stand tall, squeeze your glutes":"قف مستقيمًا وشدّ أردافك","Push hips back, slide weight down":"ادفع الوركين للخلف وأنزل الوزن","Rise up onto your toes":"ارتفع على أصابع قدميك","Lower your heels slowly":"أنزل كعبيك ببطء","Stand in front of a chair":"قف أمام كرسي","Sit back until you touch the seat":"اجلس للخلف حتى تلمس المقعد","Keep chest up, weight in heels":"الصدر مرفوع، والوزن على الكعبين","Stand up tall":"قف منتصبًا","Bend elbows, chest toward the wall":"اثنِ المرفقين، والصدر نحو الحائط","Push back to straight arms":"ادفع حتى تستقيم ذراعاك","Hold a chair, lift one knee":"أمسك كرسيًا وارفع ركبة واحدة","Stay steady, switch legs every 20 s":"اثبت، وبدّل الساق كل 20 ثانية","More for today: challenges, tips, kitchen, sleep":"المزيد لليوم: التحديات والنصائح والمطبخ والنوم","Small steps every day add up to big change.":"الخطوات الصغيرة كل يوم تصنع تغييرًا كبيرًا.","You don't need a perfect day. You need a better one than yesterday.":"لا تحتاج يومًا مثاليًا، بل يومًا أفضل من أمس.","Strength is built one rep at a time.":"القوة تُبنى تكرارًا بعد تكرار.","Choose what you want most over what you want right now.":"اختر ما تريده أكثر على ما تريده الآن.","Talk to your body kindly, then train it well.":"تحدث إلى جسمك بلطف، ثم درّبه جيدًا.","Progress counts. Perfection doesn't.":"التقدم هو المهم، لا الكمال.","Every healthy meal is a vote for the person you're becoming.":"كل وجبة صحية صوت للشخص الذي تصبحه.","The hardest part is starting, and you've already started.":"أصعب جزء هو البداية، وقد بدأت بالفعل.","Sweat now, smile later.":"اعرق الآن، وابتسم لاحقًا.","Rest is part of the plan, not a break from it.":"الراحة جزء من الخطة، لا استراحة منها.","Steady beats extreme when the goal is for life.":"الثبات يتفوق على التطرف حين يكون الهدف مدى الحياة.","Drink the water. Eat the protein. Take the walk.":"اشرب الماء. كُل البروتين. امشِ.","A 20-minute workout beats the one you skipped.":"تمرين 20 دقيقة أفضل من التمرين الذي فوّته.","Make it easy to start and hard to quit.":"اجعل البدء سهلًا والتوقف صعبًا.","Your future self is counting on today's choices.":"مستقبلك يعتمد على اختيارات اليوم.","Habits are just promises you keep to yourself.":"العادات وعود تفي بها لنفسك.","One bad meal doesn't ruin a week. One good habit can change a year.":"وجبة سيئة لا تفسد أسبوعًا. عادة جيدة قد تغير عامًا.","Show up on the days you don't feel like it. Those days count double.":"احضر في الأيام التي لا ترغب فيها. تلك الأيام تُحسب مرتين.","Strong body, clear mind.":"جسم قوي، عقل صافٍ.","You are one workout away from a better mood.":"أنت على بعد تمرين واحد من مزاج أفضل.","Fuel your body like it's someone you love.":"غذِّ جسمك كأنه شخص تحبه.","Slow progress is still progress.":"التقدم البطيء يبقى تقدمًا.","The scale is one number. How you feel is the real score.":"الميزان رقم واحد. شعورك هو النتيجة الحقيقية.","Discipline is remembering why you started.":"الانضباط هو أن تتذكر لماذا بدأت.","Move a little more, eat a little better, sleep a little longer.":"تحرك أكثر قليلًا، وكُل أفضل قليلًا، ونم أطول قليلًا.","Champions are made on ordinary days.":"الأبطال يُصنعون في الأيام العادية.","Your only competition is who you were last month.":"منافسك الوحيد هو أنت في الشهر الماضي.","Energy comes from moving, not from waiting.":"الطاقة تأتي من الحركة، لا من الانتظار.","Be patient with results and impatient with excuses.":"كن صبورًا مع النتائج وغير صبور مع الأعذار.","Eat your protein first at each meal. It keeps you full longer and steadies blood sugar.":"ابدأ كل وجبة بالبروتين. يشبعك لفترة أطول ويثبت سكر الدم.","Plate rule: half vegetables, a quarter protein, a quarter whole grains.":"قاعدة الطبق: نصفه خضار، وربعه بروتين، وربعه حبوب كاملة.","Thirst often feels like hunger. Drink a glass of water and wait 10 minutes.":"العطش يشبه الجوع غالبًا. اشرب كوب ماء وانتظر 10 دقائق.","Put your phone away while eating. Slower meals mean smaller portions without trying.":"ضع هاتفك جانبًا أثناء الأكل. الأكل ببطء يعني حصصًا أصغر دون جهد.","Sleep 7–9 hours. One short night can make you noticeably hungrier the next day.":"نم 7–9 ساعات. ليلة قصيرة واحدة قد تزيد جوعك في اليوم التالي.","Prepare tomorrow's breakfast tonight. Mornings are when good plans fall apart.":"حضّر فطور الغد الليلة. الصباح هو وقت انهيار الخطط الجيدة.","Walk 10 minutes after meals. It flattens the blood-sugar spike and adds easy steps.":"امشِ 10 دقائق بعد الوجبات. يخفف ارتفاع السكر ويضيف خطوات سهلة.","Add a glass of milk or a spoon of nut butter to two meals for about 300 extra kcal.":"أضف كوب حليب أو ملعقة زبدة مكسرات إلى وجبتين لنحو 300 سعرة إضافية.","Progressive overload: add a rep or 2.5 kg once you finish all sets with good form.":"الزيادة التدريجية: أضف تكرارًا أو 2.5 كغ حين تكمل كل المجموعات بأداء صحيح.","Get 20–40 g of protein at each meal. Muscles grow best from steady supply.":"تناول 20–40 غ بروتين في كل وجبة. العضلات تنمو أفضل بإمداد ثابت.","Rest 2–3 minutes between heavy sets and 60–90 seconds on lighter ones.":"استرح 2–3 دقائق بين المجموعات الثقيلة و60–90 ثانية بين الخفيفة.","Log your weights. If the numbers don't go up over a month, change something.":"سجّل أوزانك. إن لم ترتفع الأرقام خلال شهر، غيّر شيئًا.","Warm up with 2 light sets before your first heavy exercise.":"أحمِ جسمك بمجموعتين خفيفتين قبل أول تمرين ثقيل.","No weights? Lower slowly for 3 seconds. It makes bodyweight moves much harder.":"لا أوزان؟ انزل ببطء لمدة 3 ثوانٍ. هذا يجعل تمارين وزن الجسم أصعب بكثير.","Train at the same time every day. Habits stick to cues.":"تمرن في الوقت نفسه يوميًا. العادات ترتبط بالإشارات.","Stand up from a chair without your hands 10 times a day. It builds leg strength for life.":"قم من الكرسي دون يديك 10 مرات يوميًا. يبني قوة الساقين مدى الحياة.","Practise balance while brushing your teeth: one foot, then the other.":"تدرّب على التوازن أثناء تنظيف أسنانك: قدم ثم الأخرى.","At your pre-dawn meal, add protein and slow carbs so you stay full longer.":"في السحور أضف البروتين والكربوهيدرات البطيئة لتبقى شبعان أطول.","Break your fast with water and something light, then pause before the main meal.":"افطر على الماء وشيء خفيف، ثم توقف قليلًا قبل الوجبة الرئيسية.","Break your fast with protein. It keeps the next hours of hunger calm.":"افطر على البروتين. يهدّئ الجوع في الساعات التالية.","Black coffee, plain tea and water are fine during your fasting window.":"القهوة السوداء والشاي السادة والماء مسموحة خلال فترة الصيام.","Taste before you salt. Most salt comes from bread, sauces and pickles.":"تذوّق قبل أن تملّح. معظم الملح يأتي من الخبز والصلصات والمخللات.","Start the day with oats. Their soluble fibre helps lower LDL cholesterol.":"ابدأ يومك بالشوفان. أليافه الذائبة تساعد على خفض الكوليسترول الضار.","Strength training 2–3 times a week improves how your body handles insulin.":"تمارين القوة 2–3 مرات أسبوعيًا تحسّن تعامل جسمك مع الإنسولين.","Eat small, frequent meals if you feel sick, and keep plain crackers by the bed.":"كُلي وجبات صغيرة متكررة إن شعرت بالغثيان، واحتفظي ببسكويت سادة قرب السرير.","Strong thighs protect your knees. Chair squats and slow step-ups are your friends.":"الفخذان القويان يحميان الركبتين. قرفصاء الكرسي والصعود البطيء أصدقاؤك.","Lift something heavy-ish twice a week. It is the best tool against bone loss.":"ارفع شيئًا ثقيلًا نسبيًا مرتين أسبوعيًا. إنه أفضل وسيلة ضد هشاشة العظام.","Breakfast before school helps focus in class and energy for sport.":"الفطور قبل المدرسة يساعد على التركيز في الصف والطاقة للرياضة.","Protein at every meal helps keep muscle as you age: eggs, daal, fish or yogurt.":"البروتين في كل وجبة يحافظ على العضلات مع التقدم في العمر: بيض، عدس، سمك أو زبادي.","No sugary drinks today":"لا مشروبات سكرية اليوم","Eat 2 different vegetables today":"كُل نوعين مختلفين من الخضار اليوم","Stand up and move every hour":"قم وتحرك كل ساعة","Take the stairs at least once":"استخدم الدرج مرة واحدة على الأقل","Finish dinner 2 hours before bed":"أنهِ العشاء قبل النوم بساعتين","Cook one meal at home":"اطبخ وجبة واحدة في المنزل","Eat fruit instead of a sweet":"كُل فاكهة بدل الحلوى","Be in bed before 11 pm":"كن في السرير قبل 11 مساءً","Do 20 squats while the kettle boils":"قم بـ20 قرفصاء أثناء غليان الماء","Hold a 60-second plank":"اثبت في بلانك 60 ثانية","Reach 8,000 steps":"اصل إلى 8,000 خطوة","Balance on one foot for 30 seconds each side":"توازن على قدم واحدة 30 ثانية لكل جانب","Do 10 chair stands":"قم من الكرسي 10 مرات","Drink 8 glasses of water outside fasting hours":"اشرب 8 أكواب ماء خارج ساعات الصيام","Stay inside your eating window today":"التزم بفترة الأكل اليوم","Log every set and weight you lift today":"سجّل كل مجموعة ووزن ترفعه اليوم","Hit your protein target today":"حقق هدف البروتين اليوم","goal":"الهدف","Motion sensor blocked":"مستشعر الحركة محجوب","Your phone didn't allow step counting here. Use the walk timer or copy steps from your health app.":"لم يسمح هاتفك بعدّ الخطوات هنا. استخدم مؤقت المشي أو انسخ الخطوات من تطبيق الصحة.","No motion data here":"لا توجد بيانات حركة هنا","This view doesn't share your phone's motion sensor. The ins ों पर ऊपर उठें","Lower your heels slowly":"एड़ियाँ धीरे नीचे","Stand in front of a chair":"कुर्सी के सामने खड़े हों","Sit back until you touch the seat":"पीछे बैठें जब तक सीट छू जाए","Keep chest up, weight in heels":"छाती ऊपर, वज़न एड़ियों पर","Stand up tall":"सीधे खड़े हो जाएँ","Bend elbows, chest toward the wall":"कोहनियाँ मोड़ें, छाती दीवार की ओर","Push back to straight arms":"बाजू सीधे होने तक धकेलें","Hold a chair, lift one knee":"कुर्सी पकड़ें, एक घुटना उठाएँ","Stay steady, switch legs every 20 s":"स्थिर रहें, हर 20 सेकंड में पैर बदलें","More for today: challenges, tips, kitchen, sleep":"आज के लिए और: चैलेंज, सुझाव, रसोई, नींद","Small steps every day add up to big change.":"रोज़ के छोटे कदम बड़ा बदलाव बनते हैं।","You don't need a perfect day. You need a better one than yesterday.":"आपको परफ़ेक्ट दिन नहीं चाहिए, बस कल से बेहतर दिन चाहिए।","Strength is built one rep at a time.":"ताकत एक-एक रेप से बनती है।","Choose what you want most over what you want right now.":"जो सबसे ज़्यादा चाहिए, उसे अभी की चाहत से ऊपर रखें।","Talk to your body kindly, then train it well.":"अपने शरीर से प्यार से बात करें, फिर अच्छी ट्रेनिंग दें।","Progress counts. Perfection doesn't.":"प्रगति मायने रखती है, परफ़ेक्शन नहीं।","Every healthy meal is a vote for the person you're becoming.":"हर सेहतमंद खाना उस इंसान के लिए वोट है जो आप बन रहे हैं।","The hardest part is starting, and you've already started.":"सबसे मुश्किल काम शुरू करना है, और आप शुरू कर चुके हैं।","Sweat now, smile later.":"अभी पसीना, बाद में मुस्कान।","Rest is part of the plan, not a break from it.":"आराम भी प्लान का हिस्सा है, उससे छुट्टी नहीं।","Steady beats extreme when the goal is for life.":"जब लक्ष्य ज़िंदगी भर का हो, तो निरंतरता अति से बेहतर है।","Drink the water. Eat the protein. Take the walk.":"पानी पिएँ। प्रोटीन खाएँ। सैर करें।","A 20-minute workout beats the one you skipped.":"20 मिनट का वर्कआउट छोड़े हुए वर्कआउट से बेहतर है।","Make it easy to start and hard to quit.":"शुरू करना आसान और छोड़ना मुश्किल बनाएँ।","Your future self is counting on today's choices.":"आपका आने वाला कल आज के फ़ैसलों पर टिका है।","Habits are just promises you keep to yourself.":"आदतें वे वादे हैं जो आप ख़ुद से निभाते हैं।","One bad meal doesn't ruin a week. One good habit can change a year.":"एक ख़राब खाना हफ़्ता नहीं बिगाड़ता। एक अच्छी आदत साल बदल सकती है।","Show up on the days you don't feel like it. Those days count double.":"जिन दिनों मन न हो, उन दिनों भी आएँ। वे दिन दोगुने गिने जाते हैं।","Strong body, clear mind.":"मज़बूत शरीर, साफ़ दिमाग़।","You are one workout away from a better mood.":"बेहतर मूड बस एक वर्कआउट दूर है।","Fuel your body like it's someone you love.":"अपने शरीर को ऐसे खिलाएँ जैसे किसी अपने को।","Slow progress is still progress.":"धीमी प्रगति भी प्रगति है।","The scale is one number. How you feel is the real score.":"तराज़ू बस एक नंबर है। आप कैसा महसूस करते हैं, वही असली स्कोर है।","Discipline is remembering why you started.":"अनुशासन यह याद रखना है कि आपने क्यों शुरू किया।","Move a little more, eat a little better, sleep a little longer.":"थोड़ा ज़्यादा चलें, थोड़ा बेहतर खाएँ, थोड़ा ज़्यादा सोएँ।","Champions are made on ordinary days.":"चैंपियन आम दिनों में बनते हैं।","Your only competition is who you were last month.":"आपका मुक़ाबला सिर्फ़ पिछले महीने वाले आप से है।","Energy comes from moving, not from waiting.":"ऊर्जा चलने-फिरने से आती है, इंतज़ार से नहीं।","Be patient with results and impatient with excuses.":"नतीजों के लिए सब्र रखें और बहानों के लिए नहीं।","Eat your protein first at each meal. It keeps you full longer and steadies blood sugar.":"हर खाने में पहले प्रोटीन खाएँ। इससे पेट देर तक भरा रहता है और शुगर स्थिर रहती है।","Plate rule: half vegetables, a quarter protein, a quarter whole grains.":"प्लेट का नियम: आधी सब्ज़ियाँ, चौथाई प्रोटीन, चौथाई साबुत अनाज।","Thirst often feels like hunger. Drink a glass of water and wait 10 minutes.":"प्यास अक्सर भूख जैसी लगती है। एक गिलास पानी पीकर 10 मिनट रुकें।","Put your phone away while eating. Slower meals mean smaller portions without trying.":"खाते समय फ़ोन रख दें। धीरे खाने से बिना कोशिश कम खाया जाता है।","Sleep 7–9 hours. One short night can make you noticeably hungrier the next day.":"7 से 9 घंटे सोएँ। एक कम नींद वाली रात अगले दिन भूख बढ़ा देती है।","Prepare tomorrow's breakfast tonight. Mornings are when good plans fall apart.":"कल का नाश्ता आज रात तैयार करें। सुबह ही अच्छे प्लान बिखरते हैं।","Walk 10 minutes after meals. It flattens the blood-sugar spike and adds easy steps.":"खाने के बाद 10 मिनट चलें। इससे शुगर कम बढ़ती है और कदम भी बढ़ते हैं।","Add a glass of milk or a spoon of nut butter to two meals for about 300 extra kcal.":"दो खानों में एक गिलास दूध या एक चम्मच नट बटर जोड़ें, लगभग 300 अतिरिक्त कैलोरी।","Progressive overload: add a rep or 2.5 kg once you finish all sets with good form.":"धीरे-धीरे बढ़ाएँ: सब सेट सही तरीके से हो जाएँ तो एक रेप या 2.5 किलो जोड़ें।","Get 20–40 g of protein at each meal. Muscles grow best from steady supply.":"हर खाने में 20 से 40 ग्राम प्रोटीन लें। लगातार सप्लाई से मसल बेहतर बढ़ते हैं।","Rest 2–3 minutes between heavy sets and 60–90 seconds on lighter ones.":"भारी सेट के बीच 2 से 3 मिनट और हल्के सेट के बीच 60 से 90 सेकंड आराम करें।","Log your weights. If the numbers don't go up over a month, change something.":"अपने वज़न लिखें। अगर एक महीने में नंबर न बढ़ें तो कुछ बदलें।","Warm up with 2 light sets before your first heavy exercise.":"पहली भारी एक्सरसाइज़ से पहले 2 हल्के सेट से वार्म-अप करें।","No weights? Lower slowly for 3 seconds. It makes bodyweight moves much harder.":"वज़न नहीं? 3 सेकंड में धीरे नीचे आएँ। इससे बॉडीवेट एक्सरसाइज़ बहुत कठिन हो जाती है।","Train at the same time every day. Habits stick to cues.":"रोज़ एक ही समय ट्रेनिंग करें। आदतें इशारों से जुड़ती हैं।","Stand up from a chair without your hands 10 times a day. It builds leg strength for life.":"दिन में 10 बार बिना हाथों के कुर्सी से उठें। इससे उम्र भर पैर मज़बूत रहते हैं।","Practise balance while brushing your teeth: one foot, then the other.":"दाँत साफ़ करते हुए संतुलन का अभ्यास करें: एक पैर, फिर दूसरा।","At your pre-dawn meal, add protein and slow carbs so you stay full longer.":"सहरी में प्रोटीन और धीरे पचने वाले कार्ब्स जोड़ें ताकि देर तक पेट भरा रहे।","Break your fast with water and something light, then pause before the main meal.":"रोज़ा पानी और हल्की चीज़ से खोलें, फिर मुख्य खाने से पहले थोड़ा रुकें।","Break your fast with protein. It keeps the next hours of hunger calm.":"रोज़ा प्रोटीन से खोलें। अगले घंटों में भूख काबू में रहती है।","Black coffee, plain tea and water are fine during your fasting window.":"उपवास के दौरान ब्लैक कॉफ़ी, सादी चाय और पानी ठीक हैं।","Taste before you salt. Most salt comes from bread, sauces and pickles.":"नमक डालने से पहले चखें। ज़्यादातर नमक ब्रेड, सॉस और अचार से आता है।","Start the day with oats. Their soluble fibre helps lower LDL cholesterol.":"दिन की शुरुआत ओट्स से करें। इनका फ़ाइबर ख़राब कोलेस्ट्रॉल घटाता है।","Strength training 2–3 times a week improves how your body handles insulin.":"हफ़्ते में 2 से 3 बार स्ट्रेंथ ट्रेनिंग शरीर में इंसुलिन का काम बेहतर करती है।","Eat small, frequent meals if you feel sick, and keep plain crackers by the bed.":"जी मिचलाए तो थोड़ा-थोड़ा और बार-बार खाएँ, और बिस्तर के पास सादे बिस्किट रखें।","Strong thighs protect your knees. Chair squats and slow step-ups are your friends.":"मज़बूत जांघें घुटनों की रक्षा करती हैं। चेयर स्क्वाट और धीमे स्टेप-अप मददगार हैं।","Lift something heavy-ish twice a week. It is the best tool against bone loss.":"हफ़्ते में दो बार कुछ भारी उठाएँ। हड्डियों की कमज़ोरी के ख़िलाफ़ यह सबसे अच्छा तरीका है।","Breakfast before school helps focus in class and energy for sport.":"स्कूल से पहले नाश्ता क्लास में ध्यान और खेल के लिए ऊर्जा देता है।","Protein at every meal helps keep muscle as you age: eggs, daal, fish or yogurt.":"हर खाने में प्रोटीन उम्र के साथ मसल बचाता है: अंडे, दाल, मछली या दही।","No sugary drinks today":"आज कोई मीठा पेय नहीं","Eat 2 different vegetables today":"आज 2 अलग सब्ज़ियाँ खाएँ","Stand up and move every hour":"हर घंटे उठें और चलें- const durTxt=m=>{m=Math.max(0,Math.round(m));const h=Math.floor(m/60),mm=m%60;return h?`${h} h ${mm} min`:`${mm} min`};
function fastState(now){
 const ft=fastTimes();if(!ft)return null;
 const d=now||new Date(),n=d.getHours()*60+d.getMinutes(),s=toMin(ft.start),e=toMin(ft.end);
 const len=((e-s)+1440)%1440||1440,since=((n-s)+1440)%1440,fasting=since<len;

}

  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="row between small muted"><span><span>${x.start}</span> <b class="num">${st.ft.start}</b></span><span><span>${x.end}</span> <b class="num">${st.ft.end}</b></span></div>`;

 return c;
