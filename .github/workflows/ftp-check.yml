name: Check hosting folders

on:
  push:
    branches: [ftp-check]
    paths: [.github/workflows/ftp-check.yml]
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List folders on the hosting (names only)
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null 2>&1
          echo "=== home/.htaccess"; curl -sS --ssl-reqd -k --user "$U:$P" "ftp://$S/.htaccess" | head -40
          echo "=== public_html/.htaccess"; curl -sS --ssl-reqd -k --user "$U:$P" "ftp://$S/public_html/.htaccess" | head -60
          echo "=== cleanup of files uploaded to the wrong folder"
          RM="rm -f .ftp-deploy-sync-state.json 404.html delete-account.html index.html privacy.html robots.txt sitemap.xml support.html sw.js terms.html; rm -rf app assets"
          if curl -sS --ssl-reqd -k --user "$U:$P" "ftp://$S/.htaccess" | head -1 | grep -q "Khurak Fit"; then RM="$RM; rm -f .htaccess"; fi
          lftp -e "set ftp:ssl-force true; set ssl:verify-certificate no; $RM; cls -1; bye" -u "$U,$P" "$S" 2>&1 | grep -v -E "^\\.|^(etc|logs|mail|public_ftp|public_html|ssl|tmp|www)/?$" || true
          echo "=== done"
