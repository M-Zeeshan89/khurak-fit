name: Check live website

on:
  push:
    branches: [site-check]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check the live website
        run: |
          for u in / /app/ /privacy.html /delete-account.html /terms.html /support.html /nope /assets/site.css /assets/ex/jj-female.mp4 /assets/fonts/inter-400.woff /.well-known/security.txt /.ftp-deploy-sync-state.json /.htaccess /php.ini /wp-login.php "/?q=../../etc/passwd"; do
            printf "%-34s %s\n" "$u" "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' --max-time 25 "https://khurakfit.com$u")"
          done
          printf "%-34s %s\n" "http -> " "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://khurakfit.com/)"
          printf "%-34s %s\n" "www -> " "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://www.khurakfit.com/)"
          printf "%-34s %s\n" "TRACE" "$(curl -s -o /dev/null -w '%{http_code}' -X TRACE https://khurakfit.com/)"
          printf "%-34s %s\n" "sqlmap UA" "$(curl -s -o /dev/null -w '%{http_code}' -A 'sqlmap/1.7' https://khurakfit.com/)"
          echo "--- headers /"; curl -sI https://khurakfit.com/ | grep -i -E "^(strict|content-security|x-frame|x-content|referrer|permissions|cross-origin|cache-control|server|x-powered)" | cut -c1-140
          echo "--- headers /app/"; curl -sI https://khurakfit.com/app/ | grep -i -E "^(content-security|permissions)" | cut -c1-140
          curl -s https://khurakfit.com/ | grep -o '<title>[^<]*'
          echo END
