name: Check hosting folders

on:
  push:
    branches: [ftp-check]
    paths: [.github/workflows/ftp-check.yml]
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List folders on the hosting (names only)
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          for d in "" "public_html/" "domains/" "domains/khurakfit.com/" "domains/khurakfit.com/public_html/" "www/" "htdocs/"; do
            echo "=== /$d"
            curl -s --ssl-reqd --max-time 20 --user "$U:$P" "ftp://$S/$d" -l | sort | head -40 || echo "(not found)"
          done
          echo "=== pwd"
          curl -s --ssl-reqd --max-time 20 --user "$U:$P" "ftp://$S/" -Q "PWD" -l -v 2>&1 | grep -E "^< 257" || true
