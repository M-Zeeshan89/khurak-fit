name: Check hosting folders

on:
  push:
    branches: [ftp-check]
    paths: [.github/workflows/ftp-check.yml]
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List folders on the hosting (names only)
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          for d in "" "public_html/" "domains/" "www/" "htdocs/"; do
            echo "=== /$d"
            curl -sS --ssl-reqd -k --max-time 25 --user "$U:$P" "ftp://$S/$d" 2>&1 | awk '{print $1, $NF}' | head -40 || true
          done
          echo "=== domains/khurakfit.com"
          curl -sS --ssl-reqd -k --max-time 25 --user "$U:$P" "ftp://$S/domains/khurakfit.com/" 2>&1 | awk '{print $1, $NF}' | head -40 || true
          curl -sS --ssl-reqd -k --max-time 25 --user "$U:$P" "ftp://$S/domains/khurakfit.com/public_html/" 2>&1 | awk '{print $1, $NF}' | head -40 || true
          echo "=== login folder"
          curl -sv --ssl-reqd -k --max-time 25 --user "$U:$P" "ftp://$S/" -l 2>&1 | grep -E "^< (2[0-9][0-9]|5)" | grep -v -i "pass\|user" | head -20 || true
